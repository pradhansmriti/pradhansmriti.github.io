<div class="projects-grid">
  {{ range . }}
  <article class="project-card">
    {{ with .Params.image }}
    <div class="project-preview"><img src="{{ . | relURL }}" alt="" loading="lazy"></div>
    {{ end }}
    <div class="project-info">
      <h3 class="project-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      <p class="project-description">{{ .Params.description }}</p>
      {{ with .Params.tags }}<div class="project-tags">{{ range first 4 . }}<span class="tag">{{ . }}</span>{{ end }}</div>{{ end }}
      <div class="project-links">
        <a class="project-link" href="{{ .RelPermalink }}">Read the project →</a>
        {{ with .Params.github }}<a class="project-link" href="{{ . }}">Code ↗</a>{{ end }}
      </div>
    </div>
  </article>
  {{ end }}
</div>
